name: Quizfolk
options:
  bundleIdPrefix: com.quizfolk
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Quizfolk
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  Quizfolk:
    type: application
    platform: iOS
    sources: [iOS]
    resources:
      - data/categories.json
      - data/questions.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizfolk.ios
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.trivia-games
  QuizfolkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Quizfolk
schemes:
  Quizfolk:
    build:
      targets:
        Quizfolk: all
    test:
      targets: [QuizfolkTests]
