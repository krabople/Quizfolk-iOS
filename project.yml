name: Quizfolk
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.12.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
options:
  bundleIdPrefix: com.quizfolk
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_CFBundleDisplayName: Quizfolk
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.3.3
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  Quizfolk:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: [AdMobInfo.plist]
      - path: data/categories.json
        buildPhase: resources
      - path: data/questions.json
        buildPhase: resources
      - path: data/bots.json
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizfolk.ios
        INFOPLIST_FILE: iOS/AdMobInfo.plist
        QUIZFOLK_ADMOB_IOS_APP_ID: ''
        QUIZFOLK_ADMOB_IOS_REWARDED_UNIT_ID: ''
        CODE_SIGN_ENTITLEMENTS: iOS/Quizfolk.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.trivia-games
      configs:
        Debug:
          APS_ENVIRONMENT: development
          QUIZFOLK_ADMOB_IOS_APP_ID: ca-app-pub-3940256099942544~1458002511
        Release:
          APS_ENVIRONMENT: production
  QuizfolkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Quizfolk
  QuizfolkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Quizfolk
schemes:
  Quizfolk:
    build:
      targets:
        Quizfolk: all
    test:
      targets: [QuizfolkTests, QuizfolkUITests]
