name: Backend contract tests
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/test_*.py', 'scripts/test_*.php', 'data/**', '.github/workflows/backend.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify question bank and PHP syntax
        run: |
          python3 scripts/validate_bank.py
          php -l backend/public/index.php
          php scripts/test_migration.php
          php scripts/test_bank_revisions.php
          php scripts/test_tournament_schedule.php
          php scripts/test_economy.php
      - name: Run isolated API contract tests
        run: |
          php -S 127.0.0.1:8770 -t backend/public > /tmp/quizfolk-php.log 2>&1 &
          for i in $(seq 1 20); do curl -sf 'http://127.0.0.1:8770/index.php?r=health' && break || sleep 1; done
          python3 scripts/test_backend.py
          python3 scripts/test_social.py
          python3 scripts/test_tournaments.py
          python3 scripts/test_economy.py
