name: Backend contract tests
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/test_*.py', 'scripts/test_*.php', 'scripts/run_contracts.py', 'data/**', '.github/workflows/backend.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify question bank and PHP syntax
        run: |
          python3 scripts/validate_bank.py
          php -l backend/public/index.php
          php scripts/test_migration.php
          php scripts/test_bank_revisions.php
          php scripts/test_question_dedup.php
          php scripts/test_tournament_schedule.php
          php scripts/test_economy.php
      - name: Run isolated API contract tests
        run: |
          python3 scripts/run_contracts.py
