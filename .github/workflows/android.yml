name: Android build and tests
on:
  push:
    branches: [main]
    paths: ['android/**', 'data/**', 'scripts/verify_android_artifacts.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'data/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  FCM_APP_ID: ${{ vars.FCM_APP_ID }}
  FCM_API_KEY: ${{ vars.FCM_API_KEY }}
  FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
  FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate shared question bank
        run: python3 ../scripts/validate_bank.py
      - name: Verify Android and iOS wire-contract interoperability in isolated local state
        run: python3 ../scripts/run_contracts.py test_cross_platform.py
      - name: Compile, lint and run scoring and question-selection tests
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play complete games and test screen navigation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          working-directory: android
          script: bash run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quizfolk-Android-tests
          retention-days: 14
          path: |
            android/app/build/reports
            android/app/build/test-results
            android/app/build/outputs/androidTest-results
            android/build/screenshots
            android/build/emulator-log.txt
  tablet_test:
    name: Native Android tablet portrait and landscape
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile native tablet regression tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify tablet layout, rotation, duels and navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          working-directory: android
          script: bash run-emulator-tests.sh com.quizfolk.android.TabletLayoutTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quizfolk-Android-tablet-tests
          retention-days: 14
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android/build/screenshots
            android/build/emulator-log.txt
  signed_build:
    needs: [test, tablet_test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_PATH: /tmp/quizfolk-android.p12
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the dedicated Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Build signed installable APK and Play app bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:lintRelease --no-daemon --stacktrace
      - name: Verify signature, shared bank and Android-only package
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > app/build/outputs/signature.txt
          "$BUILD_TOOLS/aapt" dump badging app/build/outputs/apk/release/app-release.apk > app/build/outputs/package.txt
          python3 ../scripts/verify_android_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: Quizfolk-Android-0.3.3-${{ github.run_number }}
          retention-days: 30
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/android-verification.json
            android/app/build/outputs/signature.txt
            android/app/build/outputs/package.txt
            android/app/build/outputs/mapping/release/mapping.txt
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
