name: iOS build and tests
on:
  push:
    branches: [main]
    paths: ['iOS/**', 'Tests/**', 'UITests/**', 'data/**', 'project.yml', '.github/workflows/ios.yml', 'scripts/validate_bank.py']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Select current iOS SDK
        run: |
          XCODE_APP=$(python3 -c 'import glob,re; a=[(tuple(map(int,re.search(r"Xcode_([\d.]+)\.app$",p).group(1).split("."))),p) for p in glob.glob("/Applications/Xcode_*.app") if re.search(r"Xcode_([\d.]+)\.app$",p)]; a=[x for x in a if x[0][0]>=26]; assert a,"Xcode 26+ required"; print(max(a)[1])')
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          repository: krabople/Quizfolk-iOS
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Validate question bank
        run: python3 scripts/validate_bank.py
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl addmedia "$DEVICE" scripts/test-avatar.jpg
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild -project Quizfolk.xcodeproj -scheme Quizfolk -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -maximum-test-execution-time-allowance 120 -derivedDataPath build -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test | tee build-output.log
      - name: Capture simulator screenshot
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl launch "$SIMULATOR_ID" com.quizfolk.ios
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Quizfolk.png
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/UITestScreenshots || true
          fi
      - name: Build unsigned device archive
        env:
          QUIZFOLK_ADMOB_IOS_APP_ID: ${{ vars.QUIZFOLK_ADMOB_IOS_APP_ID }}
          QUIZFOLK_ADMOB_IOS_REWARDED_UNIT_ID: ${{ vars.QUIZFOLK_ADMOB_IOS_REWARDED_UNIT_ID }}
        run: |
          python3 scripts/validate_ios_ad_config.py
          xcodebuild -project Quizfolk.xcodeproj -scheme Quizfolk -configuration Release -destination 'generic/platform=iOS' -archivePath build/Quizfolk.xcarchive CODE_SIGNING_ALLOWED=NO QUIZFOLK_ADMOB_IOS_APP_ID="$QUIZFOLK_ADMOB_IOS_APP_ID" QUIZFOLK_ADMOB_IOS_REWARDED_UNIT_ID="$QUIZFOLK_ADMOB_IOS_REWARDED_UNIT_ID" archive
      - name: Upload simulator app, unsigned archive and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quizfolk-iOS
          retention-days: 14
          path: |
            build/Build/Products/Debug-iphonesimulator/Quizfolk.app
            build/Quizfolk.xcarchive
            build/TestResults.xcresult
            build/Quizfolk.png
            build/UITestScreenshots
            build-output.log
  ipad:
    name: Native iPad portrait and landscape
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Select current iOS SDK
        run: |
          XCODE_APP=$(python3 -c 'import glob,re; a=[(tuple(map(int,re.search(r"Xcode_([\d.]+)\.app$",p).group(1).split("."))),p) for p in glob.glob("/Applications/Xcode_*.app") if re.search(r"Xcode_([\d.]+)\.app$",p)]; a=[x for x in a if x[0][0]>=26]; assert a,"Xcode 26+ required"; print(max(a)[1])')
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          repository: krabople/Quizfolk-iOS
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Generate Xcode project and select fresh iPad simulator
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          xcrun simctl list devices available -j > build/simulators.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('build/simulators.json'))
          device=next(d for runtime,items in data['devices'].items() if 'iOS' in runtime for d in items if 'iPad Pro 13-inch' in d['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+device['udid']+'\n')
          json.dump({'device':device,'source':os.environ['SOURCE_REF'],'presentation':'native universal iPad','orientations':['portrait','landscapeLeft']},open('build/ipad-provenance.json','w'),indent=2)
          PY
          DEVICE=$(python3 -c 'import json; print(json.load(open("build/ipad-provenance.json"))["device"]["udid"])')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl uninstall "$DEVICE" com.quizfolk.ios || true
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
      - name: Build and verify universal device configuration
        run: |
          set -o pipefail
          xcodebuild -project Quizfolk.xcodeproj -scheme Quizfolk -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build-for-testing | tee build/ipad-build.log
          python3 - <<'PY'
          import json,plistlib
          p=plistlib.load(open('build/Build/Products/Debug-iphonesimulator/Quizfolk.app/Info.plist','rb'))
          assert set(p['UIDeviceFamily'])=={1,2},p.get('UIDeviceFamily')
          assert p.get('UISupportedInterfaceOrientations~iphone',p['UISupportedInterfaceOrientations'])==['UIInterfaceOrientationPortrait']
          expected={'UIInterfaceOrientationPortrait','UIInterfaceOrientationPortraitUpsideDown','UIInterfaceOrientationLandscapeLeft','UIInterfaceOrientationLandscapeRight'}
          assert set(p['UISupportedInterfaceOrientations~ipad'])==expected,p.get('UISupportedInterfaceOrientations~ipad')
          assert not p.get('UIRequiresFullScreen',False),'iPad must support dynamic resizing'
          json.dump({key:p.get(key) for key in ['UIDeviceFamily','UISupportedInterfaceOrientations','UISupportedInterfaceOrientations~iphone','UISupportedInterfaceOrientations~ipad','UIRequiresFullScreen']},open('build/ipad-configuration.json','w'),indent=2)
          PY
      - name: Validate native portrait, landscape and rotation layouts
        run: |
          set -o pipefail
          xcodebuild -project Quizfolk.xcodeproj -scheme Quizfolk -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -only-testing:QuizfolkUITests/IPadUITests -only-testing:QuizfolkUITests/RewardedAdUITests -maximum-test-execution-time-allowance 120 -derivedDataPath build -resultBundlePath build/IPadResults.xcresult CODE_SIGNING_ALLOWED=NO test-without-building | tee build/ipad-test.log
      - name: Export original iPad UI screenshots
        if: always()
        run: |
          if [ -d build/IPadResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/IPadResults.xcresult --output-path build/IPadScreenshots || true
          fi
      - name: Upload native iPad layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quizfolk-iPad-Layout
          retention-days: 14
          path: |
            build/IPadResults.xcresult
            build/IPadScreenshots
            build/ipad-provenance.json
            build/ipad-configuration.json
            build/ipad-build.log
            build/ipad-test.log
