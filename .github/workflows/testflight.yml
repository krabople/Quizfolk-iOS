name: Signed TestFlight build
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      APPLE_TEAM_ID: {required: true}
      ASC_KEY_ID: {required: true}
      ASC_ISSUER_ID: {required: true}
      ASC_API_KEY_BASE64: {required: true}
      BUILD_CERTIFICATE_BASE64: {required: true}
      P12_PASSWORD: {required: true}
permissions:
  contents: read
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: krabople/Quizfolk-iOS
          ref: main
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Prepare signing keychain
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/quizfolk.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/quizfolk.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/quizfolk.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/quizfolk.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/quizfolk.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/quizfolk.keychain-db" >/dev/null
      - name: Ensure dedicated bundle identifier
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-env"
          "$RUNNER_TEMP/asc-env/bin/pip" -q install PyJWT cryptography
          "$RUNNER_TEMP/asc-env/bin/python" scripts/apple_bundle.py
      - name: Archive signed iOS app
        run: |
          xcodebuild -project Quizfolk.xcodeproj -scheme Quizfolk -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Quizfolk.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$QUIZFOLK_PROFILE_NAME" clean archive
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>${APPLE_TEAM_ID}</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>com.quizfolk.ios</key><string>${QUIZFOLK_PROFILE_NAME}</string></dict><key>uploadSymbols</key><true/></dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Quizfolk.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: Quizfolk-signed-iOS
          path: ${{ runner.temp }}/export/Quizfolk.ipa
          retention-days: 7
      - name: Upload to App Store Connect
        run: xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/Quizfolk.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/quizfolk.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
